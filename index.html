<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif}
body{
  background: linear-gradient(135deg,#0a4cff,#4fd1ff);
  min-height:100vh;
  overflow-x:hidden;
  color:#fff;
}

/* MONEY ANIMATION */
.money{
  position:fixed;
  top:-50px;
  font-size:24px;
  animation: fall 6s linear infinite;
  opacity:0.7;
}
@keyframes fall{
  to{transform:translateY(120vh) rotate(360deg)}
}

/* WELCOME SCREEN */
#welcome{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
  animation: fadeOut 1s ease forwards;
  animation-delay:5s;
}
#welcome h1{
  font-size:2.2rem;
  letter-spacing:2px;
  animation:pulse 1.5s infinite;
}
@keyframes pulse{
  0%,100%{opacity:1}
  50%{opacity:0.4}
}
@keyframes fadeOut{
  to{opacity:0;visibility:hidden}
}

/* DOOR ANIMATION */
#doors{
  position:fixed;
  inset:0;
  z-index:90;
  display:flex;
}
.door{
  width:50%;
  background:#111;
  animation:openDoor 3s ease forwards;
}
.left{animation-delay:5s}
.right{animation-delay:5s}
@keyframes openDoor{
  to{transform:translateX(-100%)}
}
.right{
  animation-name:openDoorRight;
}
@keyframes openDoorRight{
  to{transform:translateX(100%)}
}

/* MAIN CONTAINER */
.container{
  padding:20px;
  max-width:1100px;
  margin:120px auto 40px;
  text-align:center;
}

/* HEADER BOX */
.header-box{
  background:#0b3cff;
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
}
.header-box h2{font-size:1.1rem}

.batch{
  background:#12b76a;
  padding:8px;
  border-radius:8px;
  margin-bottom:20px;
  font-size:0.95rem;
}

/* VIDEO BOX */
.video-wrapper{
  border:4px solid hotpink;
  border-radius:16px;
  padding:10px;
  animation:borderGlow 2s infinite alternate;
  background:#000;
}
@keyframes borderGlow{
  from{box-shadow:0 0 10px hotpink}
  to{box-shadow:0 0 25px deeppink}
}
video{
  width:100%;
  border-radius:10px;
}

/* WATCH BUTTON */
.watch-btn{
  margin:25px auto;
  background:#e11d48;
  padding:15px 40px;
  border:none;
  border-radius:30px;
  font-size:1.1rem;
  color:#fff;
  cursor:pointer;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}
.watch-btn:hover{transform:scale(1.05)}

/* FOOTER */
.footer{
  margin-top:30px;
  text-align:right;
  font-size:0.85rem;
  opacity:0.8;
}
</style>
