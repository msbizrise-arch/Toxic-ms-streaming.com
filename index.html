<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
  background:linear-gradient(135deg,#0a4cff,#63d2ff);
  min-height:100vh;
  overflow-x:hidden;
  color:#fff;
}

/* MONEY */
.money{
  position:fixed;
  top:-40px;
  font-size:22px;
  animation:fall 6s linear infinite;
  opacity:.7
}
@keyframes fall{
  to{transform:translateY(120vh) rotate(360deg)}
}

/* WELCOME */
#welcome{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
  animation:fadeOut 1s ease forwards;
  animation-delay:5s;
}
#welcome h1{
  font-size:2.2rem;
  letter-spacing:2px;
  animation:pulse 1.5s infinite
}
@keyframes pulse{50%{opacity:.4}}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}

/* DOORS */
#doors{position:fixed;inset:0;z-index:90;display:flex}
.door{width:50%;background:#111;animation:open 3s ease forwards}
.left{animation-delay:5s}
.right{animation-delay:5s;animation-name:openR}
@keyframes open{to{transform:translateX(-100%)}}
@keyframes openR{to{transform:translateX(100%)}}

/* MAIN */
.container{
  max-width:1100px;
  margin:130px auto 40px;
  padding:20px;
  text-align:center
}
.header-box{
  background:#0b3cff;
  padding:12px;
  border-radius:10px;
  margin-bottom:10px
}
.batch{
  background:#12b76a;
  padding:8px;
  border-radius:8px;
  margin-bottom:25px
}

/* PLACEHOLDER PLAYER BOX */
.video-placeholder{
  border:4px solid hotpink;
  border-radius:16px;
  padding:40px 20px;
  background:#000;
  animation:glow 2s infinite alternate
}
@keyframes glow{
  from{box-shadow:0 0 10px hotpink}
  to{box-shadow:0 0 25px deeppink}
}
.video-placeholder p{opacity:.8}

/* BUTTON */
.watch-btn{
  margin:30px auto;
  background:#e11d48;
  padding:15px 45px;
  border:none;
  border-radius:30px;
  font-size:1.1rem;
  color:#fff;
  cursor:pointer;
  box-shadow:0 10px 30px rgba(0,0,0,.4)
}
.watch-btn:hover{transform:scale(1.05)}

/* FOOTER */
.footer{
  margin-top:30px;
  text-align:right;
  font-size:.85rem;
  opacity:.8
}
</style>
</head>
